<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>TapWow QR Scanner</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --background: #fafafa;
        --foreground: #09090b;
        --card: #ffffff;
        --muted: #f4f4f5;
        --muted-foreground: #71717a;
        --border: #e4e4e7;
        --primary: #15803d;
        --primary-foreground: #ffffff;
        --ring: #86efac;
        --shadow: rgb(24 24 27 / 7%);
        --card-radius: 20px;
        --control-radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #09090b;
          --foreground: #fafafa;
          --card: #111113;
          --muted: #18181b;
          --muted-foreground: #a1a1aa;
          --border: #27272a;
          --primary: #4ade80;
          --primary-foreground: #052e16;
          --ring: #166534;
          --shadow: rgb(0 0 0 / 30%);
        }
      }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; min-height: 100dvh; margin: 0; background: var(--background); color: var(--foreground); }
      .page-shell { width: min(100%, 540px); min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 24px 16px; display: grid; align-items: center; }
      .scan-card { padding: 20px; border: 1px solid var(--border); border-radius: var(--card-radius); background: var(--card); box-shadow: 0 18px 48px var(--shadow); }
      .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
      .card-heading h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
      .card-heading > div > p { margin: 4px 0 0; color: var(--muted-foreground); font-size: 12px; }
      .status { display: inline-flex; align-items: center; gap: 7px; margin: 0; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
      .status-indicator { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-foreground); }
      .status-hint { margin: 0; color: var(--muted-foreground); font-size: 12px; line-height: 1.4; }
      .status[data-state="working"] .status-indicator { background: #eab308; }
      .status[data-state="success"] .status-indicator { background: var(--primary); }
      .status[data-state="error"] .status-indicator { background: #ef4444; }
      .camera { position: relative; display: grid; place-items: center; overflow: hidden; width: 100%; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 16px; background: #09090b; }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .camera-placeholder { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; padding: 24px; color: #a1a1aa; text-align: center; pointer-events: none; }
      .camera-placeholder strong { color: #e4e4e7; font-size: 14px; font-weight: 550; }
      .camera-placeholder span { font-size: 12px; }
      .camera.is-active .camera-placeholder { visibility: hidden; opacity: 0; }
      .guide { position: absolute; inset: 16%; border: 2px solid var(--primary); border-radius: 16px; box-shadow: 0 0 0 999px rgb(9 9 11 / 30%); pointer-events: none; }
      .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
      button { min-height: 40px; padding: 0 16px; border: 0; border-radius: var(--control-radius); background: var(--primary); color: var(--primary-foreground); font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; transition: background-color 150ms ease, transform 150ms ease, opacity 150ms ease; }
      button:hover:not(:disabled) { filter: brightness(.96); }
      button:active:not(:disabled) { transform: scale(.98); }
      button:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
      button:disabled { cursor: wait; opacity: .65; }
      .result { margin: 0 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
      .result-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
      .result-heading h3 { margin: 0; font-size: 13px; font-weight: 600; }
      .result-heading span { color: var(--muted-foreground); font-size: 11px; }
      output { display: block; min-height: 58px; padding: 12px; border: 1px solid var(--border); border-radius: var(--control-radius); background: var(--muted); color: var(--foreground); font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }
      output:empty::before { content: "Nội dung QR sẽ hiện tại đây"; color: var(--muted-foreground); }
      @media (max-width: 760px) {
        .page-shell { padding: 16px; }
        .scan-card { padding: 14px; }
        .controls { align-items: stretch; flex-direction: column; }
        button { width: 100%; min-height: 44px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="scan-card" aria-label="Trình quét mã QR">
        <div class="result">
          <div class="result-heading">
            <h3>Nội dung QR</h3>
            <span id="result-type">Chưa có kết quả</span>
          </div>
          <output id="result" aria-live="polite"></output>
        </div>
        <div class="card-heading">
          <div>
            <h2>Camera</h2>
            <p>Canh mã QR vào trong khung</p>
          </div>
          <p class="status" id="status" data-state="ready" role="status" aria-live="polite">
            <span class="status-indicator" aria-hidden="true"></span>
            <span id="status-text">Sẵn sàng</span>
          </p>
        </div>
        <div class="camera" id="camera-frame" aria-label="Khung camera quét mã QR">
          <video id="camera" autoplay muted playsinline></video>
          <div class="camera-placeholder" id="camera-placeholder">
            <strong>Camera sẽ hiển thị tại đây</strong>
            <span>Nhấn nút bên dưới để bắt đầu quét</span>
          </div>
          <div class="guide" aria-hidden="true"></div>
        </div>
        <div class="controls">
          <p class="status-hint">Camera chỉ bật khi bạn cho phép</p>
          <button id="start" type="button">Bật camera</button>
        </div>
      </section>
    </main>
    <script type="module">
      import QrScanner from './vendor/qr-scanner/qr-scanner.min.js';

      const video = document.querySelector('#camera');
      const cameraFrame = document.querySelector('#camera-frame');
      const start = document.querySelector('#start');
      const status = document.querySelector('#status');
      const statusText = document.querySelector('#status-text');
      const statusHint = document.querySelector('.status-hint');
      const result = document.querySelector('#result');
      const resultType = document.querySelector('#result-type');
      let scanning = false;
      const scanner = new QrScanner(video, ({ data }) => {
        if (!scanning) return;
        scanning = false;
        result.textContent = data;
        status.dataset.state = 'success';
        statusText.textContent = 'Đã quét';
        resultType.textContent = 'Đã nhận nội dung';
        start.textContent = 'Quét mã khác';
        scanner.stop();
      }, {
        preferredCamera: 'environment',
        maxScansPerSecond: 8,
        returnDetailedScanResult: true,
      });
      scanner.setInversionMode('both');

      start.addEventListener('click', async () => {
        start.disabled = true;
        status.dataset.state = 'working';
        statusText.textContent = 'Đang mở camera';
        statusHint.textContent = 'Camera chỉ bật khi bạn cho phép';
        try {
          result.textContent = '';
          resultType.textContent = 'Đang chờ kết quả';
          scanning = true;
          cameraFrame.classList.add('is-active');
          await scanner.start();
          if (scanning) {
            statusText.textContent = 'Đang quét';
            start.textContent = 'Đang quét…';
          }
        } catch (error) {
          scanning = false;
          scanner.stop();
          cameraFrame.classList.remove('is-active');
          status.dataset.state = 'error';
          statusText.textContent = error.name === 'NotAllowedError'
            ? 'Cần quyền camera'
            : 'Camera không mở được';
          statusHint.textContent = error.name === 'NotAllowedError'
            ? 'Cho phép camera trong Safari rồi thử lại.'
            : 'Kiểm tra quyền camera rồi thử lại.';
          resultType.textContent = 'Chưa có kết quả';
          console.error(error);
        } finally {
          start.disabled = false;
        }
      });
    </script>
  </body>
</html>
